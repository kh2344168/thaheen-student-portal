name: Deploy Angular app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build for the repository subpath
        run: npm run build -- --base-href /thaheen-student-portal/
      - name: Allow direct links to Angular routes
        run: cp dist/thaheen-offline-lms/browser/index.html dist/thaheen-offline-lms/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/thaheen-offline-lms/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
